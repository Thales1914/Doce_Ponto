openapi: 3.0.3
info:
  title: DocePonto — Backend, banco e autenticação
  version: 1.0.0
  description: "Fase 2 (21/09 a 27/09/2026): API Express, PostgreSQL e
    autenticação administrativa. Faça login e envie Authorization: Bearer
    <token> para acessar /auth/me. Erros retornam { erro: { codigo, mensagem,
    detalhes? } }. Não há cadastro público de administradores."
servers:
  - url: /api
tags:
  - name: Autenticação
paths:
  /health:
    get:
      summary: Verificação de saúde da API
      responses:
        "200":
          description: API no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Login da administradora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  format: email
                  example: admin@doces.local
                  maxLength: 255
                senha:
                  type: string
                  minLength: 1
                  maxLength: 72
                  description: Máximo de 72 bytes em UTF-8.
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  tipo:
                    type: string
                    example: Bearer
                  expira_em:
                    type: string
                    example: 8h
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/Validacao"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "429":
          $ref: "#/components/responses/MuitasRequisicoes"
  /auth/me:
    get:
      tags:
        - Autenticação
      summary: Dados da administradora autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Validacao:
      description: Dados de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    MuitasRequisicoes:
      description: Limite de requisições excedido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: object
          properties:
            codigo:
              type: string
              example: REQUISICAO_INVALIDA
            mensagem:
              type: string
            detalhes:
              type: array
              items:
                type: object
                properties:
                  local:
                    type: string
                    example: body
                  campo:
                    type: string
                    example: email
                  mensagem:
                    type: string
    Admin:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
